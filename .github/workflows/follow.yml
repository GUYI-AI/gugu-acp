name: Claude ABC A comparison
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the read-only A comparison
        type: boolean
        default: false
      check_abc_host_only:
        description: Compare the configured ABC hostname without making a model request
        type: boolean
        default: false
      expected_abc_hostname:
        description: The expected hostname for the ABC configuration check
        type: string
        required: false
permissions:
  contents: read
jobs:
  check-host:
    if: inputs.check_abc_host_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare the configured ABC hostname
        env:
          ABC_ANTHROPIC_BASE_URL: ${{ secrets.ABC_ANTHROPIC_BASE_URL }}
          EXPECTED_ABC_HOSTNAME: ${{ inputs.expected_abc_hostname }}
        run: |
          node --input-type=module <<'NODE'
          const address = process.env.ABC_ANTHROPIC_BASE_URL?.trim()
          const expected = process.env.EXPECTED_ABC_HOSTNAME?.trim().toLowerCase()

          if (!address || !expected) {
            console.log('未配置')
          } else {
            let hostname
            try { hostname = new URL(address).hostname } catch {}
            console.log(hostname === expected ? '匹配' : '不匹配')
          }
          NODE
  compare:
    if: inputs.dry_run && !inputs.check_abc_host_only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and test the candidate
        run: node scripts/build.mjs claude-agent-acp
      - name: Install the four comparison components
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/claude-abc-matrix"
          mkdir -p "$work"
          tarball="$GITHUB_WORKSPACE/.work/claude-agent-acp/out/gugu-acp-claude-agent-acp-1.7.2.tgz"
          npm install --prefix "$work/bridge-1.7.1" --omit=dev --no-audit --no-fund @gugu-acp/claude-agent-acp@1.7.1
          npm install --prefix "$work/bridge-1.7.2" --omit=dev --no-audit --no-fund "$tarball"
          for cli in 2.1.328 2.1.332; do
            npm install --prefix "$work/cli-$cli" --no-audit --no-fund "@anthropic-ai/claude-code@$cli"
          done
      - name: Compare the ABC A phase on one runner
        env:
          ABC_ANTHROPIC_BASE_URL: ${{ secrets.ABC_ANTHROPIC_BASE_URL }}
          ABC_ANTHROPIC_AUTH_TOKEN: ${{ secrets.ABC_ANTHROPIC_AUTH_TOKEN }}
          ABC_ANTHROPIC_MODEL: ${{ vars.ABC_ANTHROPIC_MODEL }}
        run: node scripts/abc-a-matrix.mjs "$RUNNER_TEMP/claude-abc-matrix"
