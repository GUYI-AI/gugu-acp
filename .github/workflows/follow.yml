name: Stop hook 990 old-CLI ABC
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compatibility verification only; publishing is never enabled here'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: stop-hook-990-abc
  cancel-in-progress: false
jobs:
  abc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GIT_COMMITTER_NAME: gugu-acp bot
      GIT_COMMITTER_EMAIL: gugu-acp@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the merged source and install isolated bridge and CLI
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node scripts/build.mjs claude-agent-acp > build.log 2>&1 || { tail -n 100 build.log; exit 1; }
          GUGU_ABC_TARBALL="$(tail -n 1 build.log)"
          test -f "$GUGU_ABC_TARBALL"
          npm install --prefix "$RUNNER_TEMP/bridge-990" --omit=dev --no-audit --no-fund "$GUGU_ABC_TARBALL"
          npm install --prefix "$RUNNER_TEMP/cli-990" --no-audit --no-fund @anthropic-ai/claude-code@2.1.293
          mkdir -p "$RUNNER_TEMP/claude-config-990" "$RUNNER_TEMP/abc-work-990"
      - name: Full ABC with real CLI 2.1.293 and the CI model service
        shell: bash
        env:
          ABC_ANTHROPIC_BASE_URL: ${{ secrets.ABC_ANTHROPIC_BASE_URL }}
          ABC_ANTHROPIC_AUTH_TOKEN: ${{ secrets.ABC_ANTHROPIC_AUTH_TOKEN }}
          ABC_ANTHROPIC_MODEL: ${{ vars.ABC_ANTHROPIC_MODEL }}
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config-990
        run: |
          set -euo pipefail
          test -n "$ABC_ANTHROPIC_BASE_URL"
          test -n "$ABC_ANTHROPIC_AUTH_TOKEN"
          timeout 12m node scripts/abc.mjs \
            --adapter "$RUNNER_TEMP/bridge-990/node_modules/@gugu-acp/claude-agent-acp/dist/index.js" \
            --cli "$RUNNER_TEMP/cli-990/node_modules/.bin/claude" \
            --work "$RUNNER_TEMP/abc-work-990" | tee abc-2.1.293.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stop-hook-990-abc-2.1.293
          path: |
            build.log
            abc-2.1.293.log
          if-no-files-found: warn
          retention-days: 14
