name: Stop hook 990 boundary ABC
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compatibility verification only; publishing is never enabled here'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: stop-hook-990-boundary-abc
  cancel-in-progress: false
jobs:
  abc:
    name: ABC CLI ${{ matrix.cli }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cli: ['2.1.304', '2.1.307', '2.1.310']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GIT_COMMITTER_NAME: gugu-acp bot
      GIT_COMMITTER_EMAIL: gugu-acp@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install published bridge 1.6.2 and the isolated CLI
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          npm install --prefix "$RUNNER_TEMP/bridge-990" --omit=dev --no-audit --no-fund @gugu-acp/claude-agent-acp@1.6.2 2>&1 | tee install.log
          npm install --prefix "$RUNNER_TEMP/cli-990" --no-audit --no-fund @anthropic-ai/claude-code@${{ matrix.cli }} 2>&1 | tee -a install.log
          node -e 'const p=require(process.argv[1]);if(p.version!=="1.6.2"||!p.gugu.patches.includes("0015-forward-native-blocking-stop-hook-notices.patch"))throw new Error("unexpected bridge package")' "$RUNNER_TEMP/bridge-990/node_modules/@gugu-acp/claude-agent-acp/package.json"
          mkdir -p "$RUNNER_TEMP/claude-config-990" "$RUNNER_TEMP/abc-work-990"
      - name: Full ABC with real CLI ${{ matrix.cli }} and the CI model service
        shell: bash
        env:
          ABC_ANTHROPIC_BASE_URL: ${{ secrets.ABC_ANTHROPIC_BASE_URL }}
          ABC_ANTHROPIC_AUTH_TOKEN: ${{ secrets.ABC_ANTHROPIC_AUTH_TOKEN }}
          ABC_ANTHROPIC_MODEL: ${{ vars.ABC_ANTHROPIC_MODEL }}
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config-990
        run: |
          set -euo pipefail
          test -n "$ABC_ANTHROPIC_BASE_URL"
          test -n "$ABC_ANTHROPIC_AUTH_TOKEN"
          timeout 12m node scripts/abc.mjs \
            --adapter "$RUNNER_TEMP/bridge-990/node_modules/@gugu-acp/claude-agent-acp/dist/index.js" \
            --cli "$RUNNER_TEMP/cli-990/node_modules/.bin/claude" \
            --work "$RUNNER_TEMP/abc-work-990" | tee abc-${{ matrix.cli }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stop-hook-990-abc-${{ matrix.cli }}
          path: |
            install.log
            abc-${{ matrix.cli }}.log
          if-no-files-found: warn
          retention-days: 14
